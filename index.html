<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Menu - Navy</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#1a1f3a;
  --cream:#e8e0d5;
  --red:#c0392b;
  --white:#ffffff;
  --dark:#111827;
}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--cream);font-family:'Montserrat',sans-serif;}

#menu-view{width:1920px;height:1080px;display:grid;grid-template-columns:320px 1fr;grid-template-rows:1fr;}

/* LEFT SIDEBAR */
.sidebar{background:var(--navy);display:flex;flex-direction:column;padding:40px 32px;position:relative;overflow:hidden;}
.sidebar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:45%;background:#111827;}

.logo-area{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:32px;}
.logo-icon{width:70px;height:70px;border:3px solid rgba(255,255,255,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:white;margin-bottom:16px;}
.logo-sub{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.6);font-weight:400;margin-bottom:4px;}
.logo-main{font-family:'Playfair Display',serif;font-size:52px;font-weight:900;color:white;line-height:1;letter-spacing:2px;}

.sidebar-img-area{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;gap:16px;margin-bottom:24px;}
.img-placeholder{border-radius:12px;overflow:hidden;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);}
.img-placeholder:first-child{height:160px;}
.img-placeholder:last-child{height:140px;}

.sidebar-contact{position:relative;z-index:1;text-align:center;}
.contact-label{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:6px;}
.contact-phone{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:white;margin-bottom:8px;}
.contact-addr{font-size:12px;color:rgba(255,255,255,0.5);line-height:1.5;}

/* PROGRESS */
.progress-wrap{position:absolute;bottom:0;left:320px;right:0;height:4px;background:rgba(0,0,0,0.1);z-index:10;}
.progress-fill{height:100%;background:var(--red);width:0%;transition:width linear;}

/* RIGHT CONTENT */
.right-content{background:var(--cream);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;position:relative;}

/* Quadrant */
.quadrant{padding:28px 36px;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.quadrant:nth-child(1){border-right:2px solid rgba(0,0,0,0.1);border-bottom:2px solid rgba(0,0,0,0.1);}
.quadrant:nth-child(2){border-bottom:2px solid rgba(0,0,0,0.1);}
.quadrant:nth-child(3){background:var(--navy);border-right:2px solid rgba(255,255,255,0.1);}
.quadrant:nth-child(4){background:var(--navy);}

/* Category title */
.cat-title{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:var(--dark);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;}
.cat-title.light{color:var(--cream);}
.cat-divider{width:60px;height:3px;background:var(--dark);margin-bottom:14px;flex-shrink:0;}
.cat-divider.light{background:rgba(255,255,255,0.3);}

/* Items */
.items-wrap{display:flex;flex-direction:column;flex:1;min-height:0;}
.menu-item{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,0.08);flex:1;min-height:0;padding:3px 0;gap:12px;}
.menu-item.light{border-bottom-color:rgba(255,255,255,0.1);}
.menu-item:last-child{border-bottom:none;}
.item-left{flex:1;}
.item-name{font-size:20px;font-weight:700;color:var(--dark);line-height:1.2;}
.item-name.light{color:var(--white);}
.item-desc{font-size:14px;color:#6b7280;font-style:italic;margin-top:2px;line-height:1.3;}
.item-desc.light{color:rgba(255,255,255,0.5);}
.price-badge{background:var(--red);color:white;padding:5px 14px;border-radius:4px;font-size:18px;font-weight:700;white-space:nowrap;flex-shrink:0;font-family:'Montserrat',sans-serif;}
.price-badge.dark{background:var(--red);}

/* Multi-price layout */
.item-prices{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.price-cell{text-align:center;min-width:85px;}
.price-val{font-size:20px;font-weight:700;color:var(--red);}
.price-val.light{color:#ff6b6b;}

/* Price header */
.price-header{display:flex;justify-content:flex-end;margin-bottom:4px;flex-shrink:0;}
.ph-label{font-size:13px;font-weight:700;color:var(--red);min-width:85px;text-align:center;}
.ph-label.light{color:#ff6b6b;}

/* Admin button hidden */
#admin-btn-wrap{position:fixed;bottom:8px;right:12px;z-index:200;}
.admin-btn{background:none;border:none;color:rgba(0,0,0,0.08);cursor:pointer;font-size:11px;}
</style>
</head>
<body>
<div id="menu-view">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo-area">
      <div class="logo-icon">🍽</div>
      <div class="logo-sub">Food &amp; Beverage</div>
      <div class="logo-main">MENU</div>
    </div>
    <div class="sidebar-img-area">
      <div class="img-placeholder" style="height:180px;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:48px;">🥘</span>
      </div>
      <div class="img-placeholder" style="height:150px;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:48px;">🍖</span>
      </div>
    </div>
    <div class="sidebar-contact">
      <div class="contact-label">Reservation</div>
      <div class="contact-phone" id="display-phone">(925) 932-8404</div>
      <div class="contact-addr" id="display-addr">1512 Sunnyvale Ave<br>Walnut Creek, CA 94597</div>
    </div>
  </div>

  <!-- RIGHT CONTENT -->
  <div class="right-content" id="page-grid"></div>
</div>

<div class="progress-wrap"><div class="progress-fill" id="progress-fill"></div></div>

<script>
const SHEET_ID='1TrMRAAE4_VLlwB35qRV-uLTTlsfYrGJWek8C3f6kUIw';
const INTERVAL=30;

let allCategories=[];
let activePage=0;
let slideshowTimer=null;
let fetchTimer=null;

async function fetchSheet(){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1&cachebust=${Date.now()}`;
  try{
    const res=await fetch(url,{cache:'no-store'});
    const text=await res.text();
    const json=JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    const rows=json.table.rows;
    const catMap={};const catOrder=[];
    rows.forEach(row=>{
      if(!row.c||!row.c[0]||!row.c[0].v)return;
      const cat=String(row.c[0].v).trim();
      const name=row.c[1]?String(row.c[1].v||'').trim():'';
      const desc=row.c[2]?String(row.c[2].v||'').trim():'';
      const p1raw=row.c[3]?String(row.c[3].v||'').trim():'';
      const p2raw=row.c[4]?String(row.c[4].v||'').trim():'';
      const p2l=row.c[5]?String(row.c[5].v||'').trim():'';
      const p3raw=row.c[6]?String(row.c[6].v||'').trim():'';
      const p3l=row.c[7]?String(row.c[7].v||'').trim():'';
      const fmt=v=>v&&!isNaN(v)?'$'+parseFloat(v).toFixed(2):v;
      if(!name||name.toLowerCase()==='name')return;
      if(!catMap[cat]){catMap[cat]=[];catOrder.push(cat);}
      catMap[cat].push({name,desc,price:fmt(p1raw),price2:fmt(p2raw),price2label:p2l,price3:fmt(p3raw),price3label:p3l});
    });
    allCategories=catOrder.map(c=>({name:c,items:catMap[c]}));
    if(activePage>=Math.ceil(allCategories.length/4))activePage=0;
    renderPage();
  }catch(e){console.error(e);}
}

function startAutoFetch(){
  fetchSheet();
  if(fetchTimer)clearInterval(fetchTimer);
  fetchTimer=setInterval(fetchSheet,5*60*1000);
}

function startSlideshow(){
  stopSlideshow();
  const ms=INTERVAL*1000;
  const fill=document.getElementById('progress-fill');
  fill.style.transition='none';fill.style.width='0%';
  requestAnimationFrame(()=>{fill.style.transition=`width ${ms}ms linear`;fill.style.width='100%';});
  slideshowTimer=setInterval(()=>{
    const total=Math.ceil(allCategories.length/4);
    activePage=(activePage+1)%total;
    renderPage();
    fill.style.transition='none';fill.style.width='0%';
    requestAnimationFrame(()=>{fill.style.transition=`width ${ms}ms linear`;fill.style.width='100%';});
  },ms);
}
function stopSlideshow(){if(slideshowTimer)clearInterval(slideshowTimer);}

function renderPage(){
  const start=activePage*4;
  const pageCats=allCategories.slice(start,start+4);
  const grid=document.getElementById('page-grid');
  grid.innerHTML='';

  const count=pageCats.length;
  if(count<=2){
    grid.style.gridTemplateRows='1fr';
    for(let i=0;i<2;i++){
      const q=document.createElement('div');
      q.className='quadrant';
      // alternate dark/light
      if(i===1){q.style.background='var(--navy)';}
      if(pageCats[i])q.appendChild(buildCatBlock(pageCats[i],i===1));
      grid.appendChild(q);
    }
  } else {
    grid.style.gridTemplateRows='1fr 1fr';
    for(let i=0;i<4;i++){
      const q=document.createElement('div');
      q.className='quadrant';
      const isLight=i>=2;
      if(isLight){
        q.style.background='var(--navy)';
        if(i===2)q.style.borderRight='2px solid rgba(255,255,255,0.1)';
      }
      if(pageCats[i])q.appendChild(buildCatBlock(pageCats[i],isLight));
      grid.appendChild(q);
    }
  }
  startSlideshow();
}

function buildCatBlock(cat,isLight){
  const wrap=document.createElement('div');
  wrap.style.cssText='display:flex;flex-direction:column;height:100%;';

  // Title
  const title=document.createElement('div');
  title.className='cat-title'+(isLight?' light':'');
  title.textContent=cat.name;
  wrap.appendChild(title);

  const divider=document.createElement('div');
  divider.className='cat-divider'+(isLight?' light':'');
  wrap.appendChild(divider);

  const hasP2=cat.items.some(i=>i.price2);
  const hasP3=cat.items.some(i=>i.price3);
  const p2labels=[...new Set(cat.items.filter(i=>i.price2label).map(i=>i.price2label))];
  const p3labels=[...new Set(cat.items.filter(i=>i.price3label).map(i=>i.price3label))];

  if(hasP2){
    const ph=document.createElement('div');
    ph.className='price-header';
    ph.innerHTML='<div style="flex:1"></div>';
    if(p2labels.length)ph.innerHTML+=`<div class="ph-label${isLight?' light':''}">${p2labels[0]}</div>`;
    if(hasP3&&p3labels.length)ph.innerHTML+=`<div class="ph-label${isLight?' light':''}">${p3labels[0]}</div>`;
    wrap.appendChild(ph);
  }

  const itemsWrap=document.createElement('div');
  itemsWrap.className='items-wrap';

  cat.items.forEach(item=>{
    const el=document.createElement('div');
    el.className='menu-item'+(isLight?' light':'');

    let priceHTML='';
    if(hasP2){
      priceHTML='<div class="item-prices">';
      priceHTML+=`<div class="price-cell"><span class="price-val${isLight?' light':''}">${item.price||''}</span></div>`;
      priceHTML+=`<div class="price-cell"><span class="price-val${isLight?' light':''}">${item.price2||''}</span></div>`;
      if(hasP3)priceHTML+=`<div class="price-cell"><span class="price-val${isLight?' light':''}">${item.price3||''}</span></div>`;
      priceHTML+='</div>';
    } else {
      priceHTML=item.price?`<div class="price-badge">${item.price}</div>`:'';
    }

    el.innerHTML=`<div class="item-left"><div class="item-name${isLight?' light':''}">${item.name}</div>${item.desc?`<div class="item-desc${isLight?' light':''}">${item.desc}</div>`:''}</div>${priceHTML}`;
    itemsWrap.appendChild(el);
  });

  wrap.appendChild(itemsWrap);
  return wrap;
}

startAutoFetch();
</script>
</body>
</html>
