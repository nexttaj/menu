<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff;font-family:'Open Sans',sans-serif;}

/* ===== MENU VIEW ===== */
#menu-view{width:1920px;height:1080px;display:flex;flex-direction:column;position:absolute;top:0;left:0;}
.header{background:#F7941D;padding:12px 48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.rest-name{font-family:'Oswald',sans-serif;font-size:62px;font-weight:700;color:#1a1a1a;letter-spacing:2px;text-transform:uppercase;line-height:1;}
.rest-info{text-align:right;font-size:20px;color:#1a1a1a;line-height:1.6;font-weight:600;}
.progress-wrap{height:5px;background:rgba(0,0,0,0.15);flex-shrink:0;}
.progress-fill{height:100%;background:#C0392B;width:0%;transition:width linear;}
.page-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden;border-top:3px solid #F7941D;}
.quadrant{padding:10px 30px;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.quadrant:nth-child(1){border-right:3px solid #F7941D;border-bottom:3px solid #F7941D;}
.quadrant:nth-child(2){border-bottom:3px solid #F7941D;}
.quadrant:nth-child(3){border-right:3px solid #F7941D;}
.cat-banner{display:inline-flex;align-items:center;margin-bottom:6px;flex-shrink:0;}
.banner-left{width:0;height:0;border-top:22px solid transparent;border-bottom:22px solid transparent;border-right:22px solid #F7941D;}
.banner-mid{background:#F7941D;padding:5px 20px;font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;color:#1a1a1a;text-transform:uppercase;letter-spacing:2px;}
.banner-right{width:0;height:0;border-top:22px solid transparent;border-bottom:22px solid transparent;border-left:22px solid #F7941D;}
.price-header{display:flex;justify-content:flex-end;margin-bottom:2px;flex-shrink:0;}
.ph-label{font-size:17px;font-weight:700;color:#C0392B;width:100px;text-align:center;}
.items-wrap{display:flex;flex-direction:column;flex:1;min-height:0;}
.menu-item{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0e8e0;flex:1;min-height:0;padding:4px 0;}
.menu-item:last-child{border-bottom:none;}
.item-left{flex:1;padding-right:10px;}
.item-name{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;color:#C0392B;text-transform:uppercase;line-height:1.2;}
.item-desc{font-size:19px;color:#222;font-weight:600;line-height:1.3;margin-top:3px;}
.item-prices{display:flex;align-items:center;flex-shrink:0;}
.price-cell{width:100px;text-align:center;}
.price-val{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:#C0392B;}
.price-val.main{font-size:28px;}

/* ===== PHOTO VIEW ===== */
#photo-view{width:1920px;height:1080px;position:absolute;top:0;left:0;display:none;background:#111;overflow:hidden;}
.photo-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0.85;}
.photo-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0.7) 0%,rgba(0,0,0,0.3) 55%,rgba(0,0,0,0.1) 100%);}
.photo-left{position:absolute;left:0;top:0;bottom:0;width:55%;display:flex;align-items:center;justify-content:center;}
.photo-img-frame{width:90%;height:85%;background-size:cover;background-position:center;border:4px solid #E8602C;box-shadow:0 0 40px rgba(232,96,44,0.4);}
.photo-right{position:absolute;right:0;top:0;bottom:0;width:44%;display:flex;flex-direction:column;justify-content:center;padding:60px 60px 60px 20px;}
.photo-cat-title{font-family:'Oswald',sans-serif;font-size:64px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:3px;line-height:1;margin-bottom:16px;}
.photo-divider{width:80px;height:4px;background:#E8602C;margin-bottom:36px;}
.photo-item-row{display:flex;align-items:center;margin-bottom:20px;gap:20px;}
.photo-num{width:48px;height:48px;background:#E8602C;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:#fff;flex-shrink:0;}
.photo-item-name{font-family:'Oswald',sans-serif;font-size:28px;font-weight:600;color:#fff;flex:1;text-transform:uppercase;}
.photo-item-price{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:#F7941D;}
.photo-logo{position:absolute;top:24px;left:24px;display:flex;align-items:center;gap:12px;}
.photo-logo-icon{width:48px;height:48px;background:#E8602C;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;}
.photo-logo-name{background:rgba(232,96,44,0.85);color:white;padding:6px 16px;font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;letter-spacing:1px;}
.photo-progress{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,0.2);}
.photo-progress-fill{height:100%;background:#E8602C;width:0%;transition:width linear;}
</style>
</head>
<body>

<!-- MENU VIEW -->
<div id="menu-view">
  <div class="header">
    <div class="rest-name">Tajrish Bazaar &amp; Sunnyvale Market</div>
    <div class="rest-info">1512 Sunnyvale Ave, Walnut Creek, CA 94597<br>☎ (925) 932-8404</div>
  </div>
  <div class="progress-wrap"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="page-grid" id="page-grid"></div>
</div>

<!-- PHOTO VIEW -->
<div id="photo-view">
  <div class="photo-bg" id="photo-bg"></div>
  <div class="photo-overlay"></div>
  <div class="photo-left">
    <div class="photo-img-frame" id="photo-img-frame"></div>
  </div>
  <div class="photo-right">
    <div class="photo-cat-title" id="photo-cat-title"></div>
    <div class="photo-divider"></div>
    <div id="photo-items"></div>
  </div>
  <div class="photo-logo">
    <div class="photo-logo-icon">🍽</div>
    <div class="photo-logo-name">Tajrish Bazaar</div>
  </div>
  <div class="photo-progress"><div class="photo-progress-fill" id="photo-progress-fill"></div></div>
</div>

<script>
const SHEET_ID='1TrMRAAE4_VLlwB35qRV-uLTTlsfYrGJWek8C3f6kUIw';

// Sequence config
// type: 'menu' = show menu page, duration in ms
// type: 'photo' = show photo slide
const SEQUENCE = [
  {type:'menu', page:0, duration:60000},   // Menu page 1 — 1 min
  {type:'photo', img:'pic1.jpg', cat:'Kabobs', duration:15000},  // Kabob Koobideh
  {type:'menu', page:1, duration:15000},   // Menu page 2 — 15 sec
  {type:'menu', page:0, duration:60000},   // Menu page 1 — 1 min
  {type:'photo', img:'pic2.jpg', cat:'Kabobs', duration:15000},  // Chicken Kabob
  {type:'menu', page:1, duration:15000},   // Menu page 2 — 15 sec
  {type:'photo', img:'pic3.jpg', cat:'Stew', duration:15000},    // Stew
];

let allCategories=[];
let seqIndex=0;
let seqTimer=null;
let fetchTimer=null;

// ===== FETCH SHEET =====
async function fetchSheet(){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=menu-data+(1)&cachebust=${Date.now()}`;
  try{
    const res=await fetch(url,{cache:'no-store'});
    const text=await res.text();
    const json=JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    const rows=json.table.rows;
    const catMap={};const catOrder=[];
    rows.forEach(row=>{
      if(!row.c||!row.c[0]||!row.c[0].v)return;
      const cat=String(row.c[0].v).trim();
      const name=row.c[1]?String(row.c[1].v||'').trim():'';
      const desc=row.c[2]?String(row.c[2].v||'').trim():'';
      const p1raw=row.c[3]?String(row.c[3].v||'').trim():'';
      const p2raw=row.c[4]?String(row.c[4].v||'').trim():'';
      const p2l=row.c[5]?String(row.c[5].v||'').trim():'';
      const p3raw=row.c[6]?String(row.c[6].v||'').trim():'';
      const p3l=row.c[7]?String(row.c[7].v||'').trim():'';
      const fmt=v=>v&&!isNaN(v)?parseFloat(v).toFixed(2):v;
      if(!name||name.toLowerCase()==='name')return;
      if(!catMap[cat]){catMap[cat]=[];catOrder.push(cat);}
      catMap[cat].push({name,desc,price:fmt(p1raw),price2:fmt(p2raw),price2label:p2l,price3:fmt(p3raw),price3label:p3l});
    });
    allCategories=catOrder.map(c=>({name:c,items:catMap[c]}));
  }catch(e){console.error('Sheet error:',e);}
}

// ===== SEQUENCE =====
function startSequence(){
  showStep(seqIndex);
}

function showStep(idx){
  if(seqTimer)clearTimeout(seqTimer);
  const step=SEQUENCE[idx];

  if(step.type==='menu'){
    showMenuPage(step.page, step.duration);
  } else {
    showPhotoPage(step.img, step.cat, step.duration);
  }

  seqTimer=setTimeout(()=>{
    seqIndex=(idx+1)%SEQUENCE.length;
    showStep(seqIndex);
  }, step.duration);
}

// ===== MENU PAGE =====
function showMenuPage(pageIndex, duration){
  document.getElementById('photo-view').style.display='none';
  document.getElementById('menu-view').style.display='flex';

  const start=pageIndex*4;
  const pageCats=allCategories.slice(start,start+4);
  const grid=document.getElementById('page-grid');
  grid.innerHTML='';

  const count=pageCats.length;
  if(count<=2){
    grid.style.gridTemplateRows='1fr';
    for(let i=0;i<2;i++){
      const q=document.createElement('div');
      q.className='quadrant';
      q.style.borderBottom='none';
      if(i===0)q.style.borderRight='3px solid #F7941D';
      if(pageCats[i])q.appendChild(buildCatBlock(pageCats[i]));
      grid.appendChild(q);
    }
  }else{
    grid.style.gridTemplateRows='1fr 1fr';
    for(let i=0;i<4;i++){
      const q=document.createElement('div');
      q.className='quadrant';
      if(pageCats[i])q.appendChild(buildCatBlock(pageCats[i]));
      grid.appendChild(q);
    }
  }

  // Progress bar
  const fill=document.getElementById('progress-fill');
  fill.style.transition='none';fill.style.width='0%';
  requestAnimationFrame(()=>{fill.style.transition=`width ${duration}ms linear`;fill.style.width='100%';});
}

function buildCatBlock(cat){
  const wrap=document.createElement('div');
  wrap.style.cssText='display:flex;flex-direction:column;height:100%;';
  const banner=document.createElement('div');
  banner.className='cat-banner';
  banner.innerHTML=`<div class="banner-left"></div><div class="banner-mid">${cat.name}</div><div class="banner-right"></div>`;
  wrap.appendChild(banner);
  const hasP2=cat.items.some(i=>i.price2);
  const hasP3=cat.items.some(i=>i.price3);
  const p2labels=[...new Set(cat.items.filter(i=>i.price2label).map(i=>i.price2label))];
  const p3labels=[...new Set(cat.items.filter(i=>i.price3label).map(i=>i.price3label))];
  if(hasP2){
    const ph=document.createElement('div');
    ph.className='price-header';
    ph.innerHTML='<div class="ph-label"></div>';
    if(p2labels.length)ph.innerHTML+=`<div class="ph-label">${p2labels[0]}</div>`;
    if(hasP3&&p3labels.length)ph.innerHTML+=`<div class="ph-label">${p3labels[0]}</div>`;
    wrap.appendChild(ph);
  }
  const itemsWrap=document.createElement('div');
  itemsWrap.className='items-wrap';
  cat.items.forEach(item=>{
    const el=document.createElement('div');
    el.className='menu-item';
    let ph='<div class="item-prices">';
    if(hasP2){
      ph+=`<div class="price-cell"><span class="price-val main">${item.price?'$'+item.price:''}</span></div>`;
      ph+=`<div class="price-cell"><span class="price-val">${item.price2?'$'+item.price2:''}</span></div>`;
      if(hasP3)ph+=`<div class="price-cell"><span class="price-val">${item.price3?'$'+item.price3:''}</span></div>`;
    }else{
      ph+=`<div class="price-cell"><span class="price-val main">${item.price?'$'+item.price:''}</span></div>`;
    }
    ph+='</div>';
    el.innerHTML=`<div class="item-left"><div class="item-name">${item.name}</div>${item.desc?`<div class="item-desc">${item.desc}</div>`:''}</div>${ph}`;
    itemsWrap.appendChild(el);
  });
  wrap.appendChild(itemsWrap);
  return wrap;
}

// ===== PHOTO PAGE =====
function showPhotoPage(imgFile, catName, duration){
  document.getElementById('menu-view').style.display='none';
  document.getElementById('photo-view').style.display='block';

  // Background
  document.getElementById('photo-bg').style.backgroundImage=`url('${imgFile}')`;
  document.getElementById('photo-img-frame').style.backgroundImage=`url('${imgFile}')`;

  // Title
  document.getElementById('photo-cat-title').textContent=catName;

  // Items from sheet
  const cat=allCategories.find(c=>c.name===catName);
  const itemsEl=document.getElementById('photo-items');
  itemsEl.innerHTML='';
  if(cat){
    cat.items.slice(0,5).forEach((item,i)=>{
      const row=document.createElement('div');
      row.className='photo-item-row';
      row.innerHTML=`
        <div class="photo-num">${i+1}</div>
        <div class="photo-item-name">${item.name}</div>
        <div class="photo-item-price">${item.price?'$'+item.price:''}</div>
      `;
      itemsEl.appendChild(row);
    });
  }

  // Progress bar
  const fill=document.getElementById('photo-progress-fill');
  fill.style.transition='none';fill.style.width='0%';
  requestAnimationFrame(()=>{fill.style.transition=`width ${duration}ms linear`;fill.style.width='100%';});
}

// ===== INIT =====
async function init(){
  await fetchSheet();
  startSequence();
  // Refresh sheet every 5 min
  setInterval(async()=>{await fetchSheet();}, 5*60*1000);
}

init();
</script>
</body>
</html>
